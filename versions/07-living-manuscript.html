<!doctype html>
<html lang="en" data-theme="artifact">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>QCD</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #100f10;
      --surface: #19171a;
      --ink: #ede5d4;
      --muted: #a59b8c;
      --faint: #635d55;
      --line: #383129;
      --accent: #d3b781;
      --accent-rgb: 211, 183, 129;
      --red: #ef8e87;
      --green: #8fcab2;
      --blue: #96b9ed;
      --stone-face: #211f20;
      --heading: Georgia, "Times New Roman", serif;
      --mono: "Cascadia Code", Consolas, monospace;
    }
    :root[data-theme="instrument"] {
      --bg: #0c121a;
      --surface: #111e2a;
      --ink: #e5eff8;
      --muted: #92a9bd;
      --faint: #506477;
      --line: #273b4b;
      --accent: #b1e6ee;
      --accent-rgb: 177, 230, 238;
      --red: #ff929b;
      --green: #7fdbc0;
      --blue: #82baff;
      --stone-face: #172a38;
      --heading: "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: radial-gradient(ellipse at 51% 40%, rgba(var(--accent-rgb), .065), transparent 58%),
        repeating-linear-gradient(0deg, transparent 0 3px, #ffffff02 3px 4px);
    }
    button { font: inherit; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    button, summary { touch-action: manipulation; }
    button:focus-visible, summary:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    button:disabled { cursor: default; }
    button svg { pointer-events: none; }
    svg { display: block; }
    [hidden] { display: none !important; }
    .shell { max-width: 1320px; margin: 0 auto; padding: 26px 44px 24px; zoom: var(--workspace-scale, 1); }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-bottom: 25px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 16px; }
    .brand-mark { width: 38px; height: 44px; color: var(--accent); }
    h1 { font: normal 36px/1 var(--heading); letter-spacing: .025em; margin: 0 0 8px; }
    .header-controls { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 12px 22px; }
    .utility-controls { display: flex; align-items: center; gap: 12px; margin-left: auto; }
    .language-select { max-width: 160px; min-height: 38px; border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; background: var(--surface); color: var(--muted); font: inherit; font-size: 12px; }
    .language-select:focus { outline: none; }
    .language-select:focus-visible { text-decoration: underline; text-underline-offset: 4px; }
    @supports (appearance: base-select) {
      .language-select, .language-select::picker(select) { appearance: base-select; }
      .language-select { cursor: pointer; gap: 12px; align-items: center; }
      .language-select::picker-icon { color: var(--muted); }
      .language-select::picker(select) { min-width: 144px; padding: 4px; margin-block-start: 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface); color: var(--ink); box-shadow: 0 12px 28px #0008; }
      .language-select option { min-height: 36px; padding: 8px 12px; border: 0; border-radius: 2px; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
      .language-select option:checked { background: rgba(var(--accent-rgb), .08); color: var(--accent); }
      .language-select option:hover, .language-select option:focus { outline: none; background: rgba(var(--accent-rgb), .16); color: var(--accent); }
      .language-select option::checkmark { color: var(--accent); }
    }
    .theme-switch { display: flex; padding: 4px; border: 1px solid var(--line); border-radius: 5px; }
    .theme-switch button { border: 0; border-radius: 2px; background: transparent; padding: 8px 14px; color: var(--muted); font-size: 12px; }
    .theme-switch button[aria-pressed="true"] { color: var(--ink); background: rgba(var(--accent-rgb), .1); box-shadow: inset 0 0 0 1px rgba(var(--accent-rgb), .12); }
    .sound-button { display: flex; align-items: center; gap: 8px; border: 0; padding: 10px 0 10px 8px; background: none; color: var(--muted); font-size: 12px; }
    .sound-button svg { width: 19px; height: 19px; }
    .sound-button[aria-pressed="false"] .sound-wave { display: none; }
    .sound-button[aria-pressed="true"] { color: var(--accent); }
    .workbench { display: grid; grid-template-columns: 236px minmax(0, 1fr) 194px; gap: 24px; align-items: start; padding-top: 34px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .eyebrow { margin: 0; font: 10px/1.5 var(--mono); letter-spacing: .17em; text-transform: uppercase; color: var(--muted); }
    .inventory-count { color: var(--muted); font: 10px var(--mono); }
    .library { padding-top: 10px; }
    .palette-labels { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 21px 0 10px; color: var(--muted); font-size: 10px; text-align: center; }
    .palette { padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: #00000026; box-shadow: inset 0 2px 12px #00000040, 0 1px 0 #ffffff04; }
    .family { padding: 10px 0 12px; border-bottom: 1px solid var(--line); }
    .family:last-child { border-bottom: 0; }
    .family-head { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
    .family-head .instrument-only { font: 10px var(--mono); color: var(--piece-color); }
    .family-symbol { width: 16px; height: 16px; fill: none; stroke: var(--piece-color); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .family-line { height: 1px; flex: 1; background: linear-gradient(90deg, var(--piece-color), transparent); opacity: .25; }
    .family-pieces { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .inventory-cell { position: relative; min-width: 0; }
    .inventory-well { position: absolute; width: 100%; height: 58px; top: 5px; fill: #00000030; stroke: var(--line); stroke-width: .65; }
    .inventory-well path { stroke-dasharray: 2 3; }
    .piece {
      position: relative; min-width: 0; border: 1px solid transparent; border-radius: 3px;
      width: 100%; background: transparent; padding: 5px 0 8px; display: flex; flex-direction: column;
      align-items: center; gap: 5px; transition: background .2s, border-color .2s, transform .2s;
    }
    .piece:hover, .piece:focus-visible { background: color-mix(in srgb, var(--piece-color) 7%, transparent); border-color: color-mix(in srgb, var(--piece-color) 25%, transparent); transform: translateY(-3px); }
    .piece[aria-disabled="true"] { opacity: .65; }
    .piece[aria-disabled="true"]:hover { transform: none; }
    .piece.in-use { visibility: hidden; pointer-events: none; }
    .piece-charge { color: var(--muted); font: 11px var(--mono); white-space: nowrap; }
    .rune { width: 48px; max-width: 100%; height: 58px; color: var(--piece-color); overflow: visible; }
    .rune-frame { fill: var(--stone-face); stroke: currentColor; stroke-width: .65; stroke-opacity: .45; }
    .magnitude-1 .rune-frame { stroke-opacity: .55; }
    .rune-glyph { fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .quark-glyph { fill: currentColor; stroke: none; font: italic 26px Georgia, serif; text-anchor: middle; }
    .rune .rune-glyph { filter: drop-shadow(0 0 3px currentColor); }
    .stone-flight { position: fixed; pointer-events: none; z-index: 20; transform-origin: top left; }
    .stone-flight .rune { width: 100%; height: 100%; }
    .red { --piece-color: var(--red); }
    .green { --piece-color: var(--green); }
    .blue { --piece-color: var(--blue); }
    .library-note { color: var(--muted); font-size: 11px; margin: 13px 0 27px; }
    .examples { padding-top: 19px; border-top: 1px solid var(--line); }
    .example-buttons { display: flex; gap: 8px; margin-top: 10px; }
    .example-button { display: flex; flex: 1; justify-content: space-between; gap: 8px; border: 1px solid var(--line); background: transparent; border-radius: 3px; padding: 9px 11px; color: var(--muted); font-size: 12px; }
    .example-button:hover { border-color: var(--accent); color: var(--ink); }
    .dice { display: inline-block; width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.3; vertical-align: middle; }
    .dice .pip { fill: currentColor; stroke: none; }
    .examples > .eyebrow { display: flex; align-items: center; gap: 9px; }
    .example-button .dice { color: var(--accent); }
    .cycle-note { min-height: 16px; margin: 9px 0 0; font: 10px var(--mono); color: var(--muted); }
    .chamber { min-width: 0; text-align: center; }
    .chamber-heading { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .chamber-heading::before, .chamber-heading::after { content: ""; width: 30px; height: 1px; background: var(--line); }
    .chamber-heading .eyebrow { color: var(--accent); }
    .capacity { display: flex; justify-content: center; gap: 16px; padding: 18px 0 4px; }
    .capacity-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--accent); background: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .08), 0 0 14px rgba(var(--accent-rgb), .3); transition: background .25s, border-color .25s, box-shadow .25s; }
    .capacity-dot.spent { background: var(--bg); border-color: var(--faint); box-shadow: inset 0 1px 3px #00000080; }
    .field-wrap { position: relative; isolation: isolate; width: min(100%, 580px); margin: 0 auto; }
    .field-wrap::before { content: ""; position: absolute; width: 64%; aspect-ratio: 1; top: 17%; left: 18%; border-radius: 50%; background: radial-gradient(circle, rgba(var(--accent-rgb), .07), transparent 68%); z-index: -1; }
    .field { width: 100%; height: auto; overflow: hidden; }
    .engraving { fill: none; stroke: var(--accent); stroke-width: .7; opacity: .28; }
    .outer-ticks { stroke: var(--accent); stroke-width: 1; opacity: .3; }
    .major-ticks { opacity: .55; }
    .orbit { transform-origin: 320px 294px; }
    .orbit-detail { stroke-dasharray: 2 11; opacity: .18; }
    .guide { fill: none; stroke: var(--accent); stroke-width: .7; stroke-dasharray: 2 10; opacity: .09; }
    .triangle { fill: none; stroke: var(--accent); stroke-width: .8; stroke-dasharray: 2 8; opacity: .12; }
    .axis-node { color: var(--piece-color); opacity: .65; transition: opacity .25s; }
    .axis-node.active { opacity: 1; }
    .strand { fill: none; stroke: var(--piece-color); stroke-width: 1.8; stroke-linecap: round; opacity: .65; }
    .strand.reverse { stroke-dasharray: 4 5; }
    .strand-glow { stroke-width: 9; opacity: .12; filter: url(#softGlow); }
    .target-light { fill: url(#focusLight); opacity: .8; }
    .center-target { fill: rgba(var(--accent-rgb), .035); stroke: var(--accent); stroke-width: 1.7; opacity: .9; }
    .focus-halo { fill: url(#focusLight); opacity: .6; }
    .focus-appearing { animation: focus-appear .3s ease-out both; }
    @keyframes focus-appear { from { opacity: 0; } to { opacity: 1; } }
    .focus-ring { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .3; }
    .focus-dot { fill: var(--ink); filter: url(#pointGlow); }
    .focus-seed { fill: var(--ink); }
    .result-seal { fill: none; stroke: var(--accent); stroke-width: .8; opacity: 0; transition: opacity .4s; }
    .preview-path { fill: none; stroke: var(--piece-color); stroke-width: 1; stroke-dasharray: 3 5; opacity: .65; }
    .preview-dot { fill: var(--bg); stroke: var(--piece-color); stroke-width: 1.5; }
    .preview-ring { fill: none; stroke: var(--accent); stroke-width: 1; opacity: .65; }
    .instrument-only { display: none; }
    .instrument-label { fill: var(--muted); font: 9px var(--mono); letter-spacing: 1px; }
    .field-status { min-height: 69px; margin-top: -17px; position: relative; }
    .result-title { margin: 0; font: normal 25px/1.3 var(--heading); letter-spacing: .015em; }
    .result-detail { min-height: 18px; margin: 7px 0 0; color: var(--muted); font-size: 11px; letter-spacing: .02em; }
    .chamber[data-state="balanced"] .result-title { color: var(--accent); }
    .chamber[data-state="balanced"] .result-seal { opacity: .35; }
    .chamber[data-state="balanced"] .center-target { stroke: var(--ink); opacity: 1; }
    .chamber[data-state="balanced"] .focus-halo { opacity: 1; }
    [data-theme="artifact"] .orbit { animation: orbit-turn 100s linear infinite; }
    .chamber[data-state="empty"] #focus, .chamber[data-state="empty"] .target-light { opacity: 0; }
    .release-ring { fill: none; stroke: var(--accent); stroke-width: 1.3; opacity: 0; transform-origin: 320px 294px; }
    .chamber.arrived .release-ring { animation: release .95s ease-out; }
    .alchemy-seal { opacity: .15; transition: opacity .5s; pointer-events: none; }
    .seal-backplate { fill: var(--bg); visibility: hidden; pointer-events: none; }
    [data-theme="artifact"] .chamber[data-state="balanced"] .seal-backplate { visibility: visible; }
    .alchemy-seal .seal-icon { width: 100px; height: 100px; }
    [data-theme="artifact"] .chamber[data-state="balanced"] .alchemy-seal { opacity: 1; }
    [data-theme="artifact"] .chamber[data-state="balanced"] #focus,
    [data-theme="artifact"] .chamber[data-state="balanced"] .center-target { opacity: 0; }
    [data-theme="artifact"] .chamber.arrived .alchemy-seal .seal-icon { animation: seal-imprint .7s ease-out both; transform-origin: 50px 50px; }
    @keyframes seal-imprint { from { opacity: .1; transform: scale(1.3) rotate(-12deg); filter: blur(2px); } to { opacity: 1; transform: scale(1) rotate(0); filter: blur(0); } }
    .slots { position: absolute; inset: 0; pointer-events: none; }
    .orbit-slot { position: absolute; width: 11.875%; min-width: 40px; aspect-ratio: 76 / 82; transform: translate(-50%, -50%); }
    .socket { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: transparent; padding: 0; pointer-events: auto; }
    .socket:hover, .socket:focus-visible { z-index: 1; }
    .orbit-slot.multiple .socket:first-child { transform: translateX(-40%); }
    .orbit-slot.multiple .socket:last-child { transform: translateX(40%); }
    .socket-face { width: 100%; height: 100%; display: grid; place-items: center; position: relative; }
    .socket-outlines { position: absolute; inset: 0; width: 100%; height: 100%; fill: var(--bg); stroke: var(--line); stroke-width: 1; }
    .socket-outline-small { fill: #ffffff02; stroke-dasharray: 2 3; }
    .socket-highlight { position: absolute; inset: 0; width: 100%; height: 100%; fill: none; stroke: var(--piece-color); stroke-width: 1.6; filter: drop-shadow(0 0 3px var(--piece-color)); opacity: 0; pointer-events: none; }
    .socket-highlight path { transform-origin: 38px 41px; }
    .socket.filled[data-size="small"] .socket-highlight path { transform: scale(.57); }
    .axis-node[data-preview-size] .socket-highlight, .socket.filled:hover .socket-highlight, .socket.filled:focus-visible .socket-highlight { opacity: 1; }
    .axis-node[data-preview-size="small"] .socket .socket-highlight path { transform: scale(.57); }
    .axis-node[data-preview-size="large"] .socket .socket-highlight path { transform: scale(1); }
    .socket.empty > .socket-face { pointer-events: none; }
    .socket-target { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; padding: 0; background: transparent; clip-path: polygon(50% 3.66%, 93.42% 26.83%, 93.42% 73.17%, 50% 96.34%, 6.58% 73.17%, 6.58% 26.83%); }
    .socket-target-small { inset: auto; left: 50%; top: 50%; width: 57%; height: 57%; min-width: 24px; min-height: 24px; transform: translate(-50%, -50%); }
    .socket-target:focus-visible { outline: none; }
    .socket .rune { position: relative; width: 100%; height: 100%; }
    .socket-ghost { position: relative; width: 65%; height: 65%; opacity: .45; }
    .socket-ghost .rune-frame { display: none; }
    .socket-ghost .rune .rune-glyph { filter: none; }
    .socket .piece-charge { position: absolute; left: 0; right: 0; top: calc(100% + 3px); font-size: 10px; }
    .socket.filled .socket-outlines { stroke: color-mix(in srgb, var(--piece-color) 35%, var(--line)); }
    .socket-remove { position: absolute; right: -3px; top: -3px; border: 1px solid var(--line); background: var(--bg); width: 21px; height: 21px; border-radius: 50%; font-size: 15px; line-height: 17px; color: var(--muted); opacity: 0; transition: opacity .15s; }
    .socket:hover .socket-remove, .socket:focus-visible .socket-remove { opacity: 1; }
    .socket.optional .socket-ghost { opacity: .2; }
    .assembly-controls { display: flex; justify-content: space-between; align-items: center; width: min(100%, 290px); margin: 8px auto 0; padding: 0 8px; color: var(--muted); font: 10px var(--mono); }
    .reset { border: 0; padding: 6px 0 6px 12px; background: none; color: var(--muted); font-size: 11px; }
    .reset:hover { color: var(--ink); }
    .reset:disabled { color: var(--faint); }
    .bind-space { min-height: 52px; padding-top: 12px; }
    .bind-seal { border: 1px solid var(--accent); border-radius: 3px; padding: 9px 20px; background: rgba(var(--accent-rgb), .08); color: var(--accent); font-size: 12px; }
    .bind-seal:hover { background: rgba(var(--accent-rgb), .16); }
    .abilities { max-width: 808px; margin: 24px auto 0; padding-top: 20px; border-top: 1px solid var(--line); }
    .ability-bar { display: grid; grid-template-columns: repeat(6, minmax(0, 128px)); gap: 8px; list-style: none; padding: 0; margin: 12px 0 0; }
    .ability-slot { position: relative; min-width: 0; min-height: 112px; border: 1px solid var(--line); border-radius: 4px; background: #00000018; }
    .ability-slot.empty { display: grid; place-items: center; border-style: dashed; color: var(--faint); font: 11px var(--mono); }
    .ability-card { display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%; min-height: 110px; padding: 6px 8px; border: 0; border-radius: 4px; background: transparent; text-align: center; cursor: help; }
    .ability-card:hover, .ability-card:focus-visible { background: rgba(var(--accent-rgb), .04); }
    .ability-card .seal-icon { width: 72px; height: 72px; flex-shrink: 0; }
    .ability-label { margin-top: 2px; max-width: 100%; font-size: 12px; line-height: 1.25; overflow-wrap: anywhere; }
    .ability-remove { position: absolute; top: 0; right: 0; width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); font-size: 19px; }
    .ability-remove:hover { color: var(--ink); }
    .release-all { margin-top: 12px; min-height: 44px; padding-left: 0; }
    .seal-icon { display: block; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; color: var(--accent); }
    .seal-icon .seal-rim { stroke-width: .8; opacity: .6; }
    .ability-preview { width: 88px; height: 88px; margin: 12px 0 8px; }
    .ability-preview:empty { border: 1px dashed var(--line); border-radius: 50%; }
    .ability-name { font: normal 23px/1.25 var(--heading); overflow-wrap: anywhere; margin: 12px 0 8px; }
    .ability-detail { font-size: 11px; color: var(--muted); margin: 0 0 22px; }
    .rune-tooltip { position: fixed; z-index: 30; width: max-content; max-width: min(290px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; padding: 12px 15px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); box-shadow: 0 8px 25px #00000066; color: var(--ink); font-size: 12px; line-height: 1.65; white-space: pre-line; }
    .ability-preview .seal-icon { width: 100%; height: 100%; }
    .piece, .socket, .ability-card { -webkit-touch-callout: none; user-select: none; }
    .inventory-cell.reserved .inventory-well { stroke: var(--accent); opacity: .45; }
    .inventory-cell.reserved::after { content: ""; position: absolute; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); top: 32px; left: calc(50% - 2px); pointer-events: none; }
    .readout { padding-top: 13px; }
    .charge-value { display: block; font: normal 56px/1.25 var(--heading); margin: 15px 0 20px; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
    .charge-unit { font: 13px var(--heading); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
    .action-direction { margin: 0; color: var(--muted); font: 10px var(--mono); letter-spacing: .08em; }
    .action-scale { position: relative; margin: 8px 0; }
    .action-axis { position: absolute; left: 34px; top: 17px; bottom: 17px; width: 1px; background: var(--line); }
    .action-fill { position: absolute; width: 1px; background: var(--accent); transition: top .3s, height .3s; }
    .action-marker { position: absolute; left: -3px; width: 7px; height: 7px; border: 1px solid var(--accent); background: var(--surface); transform: translateY(-50%) rotate(45deg); transition: top .3s; }
    .action-scale[data-ready="true"] .action-marker { background: var(--accent); box-shadow: 0 0 9px rgba(var(--accent-rgb), .4); }
    .action-scale[data-ready="false"] .action-fill, .action-scale[data-ready="false"] .action-marker { background: var(--red); }
    .action-scale[data-ready="false"] .action-marker { border-color: var(--red); }
    .scale-preview { position: absolute; width: 7px; height: 7px; border: 1px dashed var(--accent); background: transparent; pointer-events: none; }
    .action-axis .scale-preview { left: -3px; transform: translateY(-50%) rotate(45deg); }
    .action-axis .scale-preview[data-ready="false"] { border-color: var(--red); }
    .charge-scale .scale-preview { top: 4px; transform: translateX(-50%) rotate(45deg); }
    .action-steps { margin: 0; padding: 0; list-style: none; }
    .action-step { position: relative; display: flex; align-items: center; min-height: 34px; padding-left: 52px; color: var(--muted); font-size: 12px; }
    .action-step::before { content: ""; position: absolute; left: 31px; width: 7px; height: 1px; background: var(--line); }
    .action-value { position: absolute; left: 0; width: 24px; text-align: right; font: 11px var(--mono); }
    .action-step[aria-current="true"] { color: var(--accent); font-weight: 600; }
    .charge-scale { height: 30px; position: relative; margin: 0 5px 29px; }
    .charge-rail { position: absolute; top: 7px; height: 1px; width: 100%; background: var(--line); }
    .charge-fill { position: absolute; top: 7px; height: 1px; background: var(--accent); transition: left .3s, width .3s; }
    .tick { position: absolute; top: 5px; width: 1px; height: 5px; background: var(--faint); }
    .tick.major { top: 2px; height: 11px; background: var(--muted); }
    .tick-label { position: absolute; top: 19px; font: 9px var(--mono); color: var(--muted); transform: translateX(-50%); }
    .charge-marker { position: absolute; top: 4px; width: 7px; height: 7px; background: var(--accent); transform: translateX(-50%) rotate(45deg); transition: left .3s; box-shadow: 0 0 10px rgba(var(--accent-rgb), .25); }
    .readout-line { height: 1px; background: var(--line); margin-bottom: 23px; }
    .balance-value { display: flex; align-items: center; gap: 9px; margin: 13px 0 8px; font-size: 13px; }
    .balance-indicator { width: 7px; height: 7px; border: 1px solid var(--muted); border-radius: 50%; }
    .readout[data-balanced="true"] .balance-indicator { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb), .4); }
    .balance-tracks { display: grid; gap: 10px; margin-top: 23px; }
    .balance-track { display: grid; grid-template-columns: 14px 1fr; align-items: center; gap: 9px; color: var(--piece-color); font: 10px var(--mono); }
    .balance-track-rail { height: 3px; position: relative; background: color-mix(in srgb, var(--piece-color) 10%, transparent); }
    .balance-track-rail::before { content: ""; position: absolute; left: 50%; top: -3px; width: 1px; height: 9px; background: var(--piece-color); opacity: .4; }
    .balance-track-fill { position: absolute; height: 3px; top: 0; background: var(--piece-color); opacity: .8; transition: left .3s, width .3s; }
    .balance-extents { display: flex; justify-content: space-between; color: var(--faint); font: 9px var(--mono); margin: 11px 0 0 23px; }
    .bottom-bar { margin-top: 35px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 32px; padding-top: 17px; }
    .science { flex: 1; max-width: 840px; }
    .science summary { width: fit-content; color: var(--muted); font-size: 11px; cursor: pointer; padding: 5px 0; }
    .science[open] summary { color: var(--accent); }
    .science-content { padding: 14px 0 4px; color: var(--muted); font-size: 12px; line-height: 1.8; }
    .science-content p { margin: 0 0 10px; }
    .science-result { color: var(--ink); }
    .colophon { margin: 5px 0 0; text-align: right; color: var(--faint); font: 9px/1.7 var(--mono); letter-spacing: .13em; white-space: nowrap; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    [data-theme="instrument"] h1 { font-size: 30px; font-weight: 300; letter-spacing: -.04em; }
    [data-theme="instrument"] body::before { background: radial-gradient(ellipse at 51% 40%, #12314855, transparent 60%); }
    [data-theme="instrument"] .artifact-only { display: none; }
    [data-theme="instrument"] .instrument-only { display: initial; }
    [data-theme="instrument"] .triangle { stroke: var(--blue); }
    [data-theme="instrument"] .guide { stroke: var(--blue); }
    [data-theme="instrument"] .outer-ticks { stroke: var(--blue); }
    [data-theme="instrument"] .result-title { font-size: 22px; font-weight: 300; letter-spacing: -.025em; }
    [data-theme="instrument"] .palette { background: #07121c80; }
    [data-theme="instrument"] .piece { border-radius: 6px; }
    [data-theme="instrument"] .rune .rune-glyph { filter: none; }
    [data-theme="instrument"] .charge-value { font-family: var(--mono); font-size: 47px; font-weight: 300; }
    [data-theme="instrument"] .strand { stroke-width: 2; }
    [data-theme="instrument"] .strand-glow { stroke-width: 8; opacity: .15; }
    [data-theme="instrument"] .orbit { animation: none !important; }
    [data-theme="artifact"] .balance-tracks, [data-theme="artifact"] .balance-extents { display: none; }
    [data-theme="artifact"] .palette-labels { display: none; }
    [data-theme="artifact"] .palette { margin-top: 21px; }
    [data-theme="artifact"] body { font-family: Georgia, "Times New Roman", serif; }
    [data-theme="artifact"] :is(h1, .result-title, .ability-name) { font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; font-style: italic; }
    [data-theme="artifact"] .eyebrow { font-family: var(--heading); font-size: 12px; font-variant: small-caps; text-transform: none; letter-spacing: .04em; }
    [data-theme="artifact"] :is(.inventory-count, .cycle-note, .assembly-controls, .action-direction, .action-value, .colophon) { font-family: var(--heading); }
    [data-theme="artifact"] :is(.library-note, .result-detail, .ability-detail) { font-size: 12px; }
    [data-theme="artifact"] :is(.library-note, .result-detail, .action-direction) { font-style: italic; }
    [data-theme="artifact"] .ability-slot { background: transparent; border-color: transparent; }
    [data-theme="artifact"] .ability-slot.empty { position: relative; font-family: var(--heading); color: var(--faint); }
    [data-theme="artifact"] .ability-slot.empty::before { content: ""; position: absolute; width: 64px; height: 64px; border: 1px solid rgba(var(--accent-rgb), .28); border-radius: 50%; box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px rgba(var(--accent-rgb), .12); }
    [data-theme="artifact"] .manuscript-ornament { fill: none; stroke: rgba(var(--accent-rgb), .35); stroke-width: .7; pointer-events: none; }
    /* Keep circular hairlines from shrinking below a CSS pixel with the SVG viewBox. */
    [data-theme="artifact"] :is(.engraving, .manuscript-ornament) circle { vector-effect: non-scaling-stroke; stroke-width: 1px; shape-rendering: geometricPrecision; }
    [data-theme="artifact"] .manuscript-inscription { fill: var(--accent); fill-opacity: .85; stroke: none; font: italic 600 19px "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif; letter-spacing: .3px; dominant-baseline: central; }
    [data-theme="artifact"] .socket .piece-charge { width: max-content; margin-inline: auto; padding-inline: 3px; background: var(--bg); }
    [data-theme="artifact"] .lower-axis .socket .piece-charge { top: auto; bottom: calc(100% + 3px); }
    [data-theme="artifact"] .field { overflow: visible; }
    [data-theme="artifact"] .field-wrap { margin-top: 30px; }
    [data-theme="artifact"] .field-status { margin-top: 24px; }
    [data-theme="artifact"] .celestial-orbit {
      fill: none; stroke: var(--accent); stroke-width: 1; pointer-events: none;
      transform-origin: 320px 294px; opacity: 0; visibility: hidden;
      animation: orbit-turn 140s linear infinite reverse; animation-play-state: paused;
      transition: opacity .6s, visibility .6s;
    }
    [data-theme="artifact"] .chamber[data-state="balanced"] .celestial-orbit { opacity: .85; visibility: visible; animation-play-state: running; }
    .celestial-orbit .star { fill: rgba(var(--accent-rgb), .25); }
    @keyframes orbit-turn { to { transform: rotate(360deg); } }
    @keyframes release { 0% { opacity: .7; transform: scale(.35); } 100% { opacity: 0; transform: scale(1.5); } }
    @media (max-width: 1180px) {
      .shell { padding: 25px 26px 20px; }
      .workbench { grid-template-columns: 210px minmax(0, 1fr) 160px; gap: 16px; }
      .library, .readout { padding-top: 12px; }
      .header-controls { gap: 13px; }
      .rune { width: 38px; }
      .charge-value { font-size: 48px; }
    }
    @media (max-width: 960px) {
      .workbench { grid-template-columns: 210px minmax(0, 1fr); column-gap: 28px; }
      .chamber { grid-column: 2; grid-row: 1 / span 2; }
      .library { grid-column: 1; grid-row: 1; padding-top: 20px; }
      .readout { grid-column: 1; grid-row: 2; padding-top: 10px; }
      .charge-value { font-size: 36px; margin: 5px 0 8px; }
      .readout-line { margin-bottom: 12px; }
      .balance-tracks, .balance-extents { display: none; }
      .charge-scale { margin-bottom: 13px; }
      .library-note { margin-bottom: 16px; }
    }
    @media (max-width: 680px) {
      .abilities { max-width: 400px; }
      .ability-bar { grid-template-columns: repeat(3, minmax(0, 128px)); }
      .ability-slot { min-height: 104px; }
      .ability-card { min-height: 102px; padding: 6px 5px; }
      .ability-card .seal-icon { width: 62px; height: 62px; }
      .ability-label { font-size: 11px; }
      .ability-remove { width: 40px; height: 40px; }
      .shell { padding: 20px 20px 16px; }
      .masthead { flex-wrap: wrap; gap: 20px; padding-bottom: 19px; }
      .brand { gap: 12px; }
      h1 { font-size: 31px; }
      .brand-mark { width: 30px; height: 37px; }
      .header-controls { width: 100%; justify-content: space-between; }
      .theme-switch button { padding: 8px 15px; }
      .workbench { display: flex; flex-direction: column; gap: 0; padding-top: 23px; }
      .chamber { order: 0; width: 100%; }
      .field-wrap { width: min(100%, 460px); margin: 0 auto; }
      .field-status { margin-top: -8px; min-height: 61px; }
      .result-title { font-size: 24px; }
      .socket-remove { width: 17px; height: 17px; line-height: 13px; font-size: 13px; opacity: .8; }
      .socket .piece-charge { font-size: 9px; }
      .library { order: 1; width: 100%; padding-top: 26px; margin-top: 22px; border-top: 1px solid var(--line); }
      .palette { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 6px; margin-top: 14px; }
      .palette-labels { display: none; }
      .family { padding-bottom: 10px; }
      .family { border-bottom: 0; }
      .family-pieces { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 2px; }
      .piece { padding: 6px 0; }
      .inventory-cell[data-order="0"] { order: 0; }
      .inventory-cell[data-order="1"] { order: 2; }
      .inventory-cell[data-order="2"] { order: 1; }
      .inventory-cell[data-order="3"] { order: 3; }
      .rune { width: 43px; height: 54px; }
      .inventory-well { height: 54px; }
      .library-note { margin-bottom: 15px; }
      .examples { padding-top: 0; border: 0; display: flex; align-items: center; gap: 17px; flex-wrap: wrap; }
      .example-buttons { flex: 1; margin: 0; }
      .cycle-note { flex-basis: 100%; margin-top: -9px; }
      .readout { order: 2; display: grid; grid-template-columns: 1fr 1fr; column-gap: 35px; width: 100%; margin-top: 25px; padding-top: 23px; border-top: 1px solid var(--line); }
      .readout-line { display: none; }
      [data-theme="instrument"] .readout-line { display: none; }
      [data-theme="artifact"] .readout { display: block; }
      .charge-value { font-size: 38px; }
      [data-theme="instrument"] .charge-value { font-size: 34px; }
      .balance-value { margin-top: 20px; }
      .balance-tracks { display: grid; margin-top: 17px; }
      .bottom-bar { margin-top: 24px; gap: 15px; }
      .colophon { font-size: 8px; }
    }
    @media (max-width: 360px) {
      .shell { padding-left: 14px; padding-right: 14px; }
      .theme-switch button { padding-left: 11px; padding-right: 11px; }
      .palette { gap: 6px; }
      .sound-button { font-size: 11px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <svg class="sr-only" aria-hidden="true"><defs><symbol id="diceIcon" viewBox="0 0 20 20"><rect x="2.5" y="2.5" width="15" height="15" rx="3"/><circle class="pip" cx="6.5" cy="6.5" r="1.25"/><circle class="pip" cx="13.5" cy="6.5" r="1.25"/><circle class="pip" cx="10" cy="10" r="1.25"/><circle class="pip" cx="6.5" cy="13.5" r="1.25"/><circle class="pip" cx="13.5" cy="13.5" r="1.25"/></symbol></defs></svg>
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 40 46" aria-hidden="true">
          <g class="brand-artifact artifact-only">
            <path d="M20 3 37 33H3ZM20 43 3 13H37Z" fill="none" stroke="currentColor" stroke-width=".8"/>
            <circle cx="20" cy="23" r="5" fill="none" stroke="currentColor"/>
            <circle cx="20" cy="23" r="1.5" fill="currentColor"/>
          </g>
          <g class="brand-instrument instrument-only">
            <circle class="quark" cx="20" cy="16" r="6.5" fill="var(--red)"/>
            <circle class="quark" cx="12.5" cy="29" r="6.5" fill="var(--green)"/>
            <circle class="quark" cx="27.5" cy="29" r="6.5" fill="var(--blue)"/>
          </g>
        </svg>
        <div><h1></h1></div>
      </div>
      <div class="header-controls">
        <div class="theme-switch" role="group" data-i18n-aria="theme.label">
          <button type="button" data-theme-choice="artifact" data-i18n="theme.artifact" aria-pressed="true"></button>
          <button type="button" data-theme-choice="instrument" data-i18n="theme.instrument" aria-pressed="false"></button>
        </div>
        <div class="utility-controls">
          <button id="toggleSound" class="sound-button" type="button" aria-pressed="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 9H8L13 5V19L8 15H4Z"/><path class="sound-wave" d="M16 8Q20 12 16 16M19 5Q25 12 19 19"/></svg>
            <span id="soundLabel"></span>
          </button>
          <select id="languageSelect" class="language-select" data-i18n-aria="language.label">
            <option value="auto">Auto</option>
            <option value="en" lang="en">English</option>
            <option value="es" lang="es">Español</option>
            <option value="pt" lang="pt-BR">Português</option>
            <option value="zh" lang="zh-Hans">简体中文</option>
            <option value="ru" lang="ru">Русский</option>
          </select>
        </div>
      </div>
    </header>

    <div class="workbench">
      <section class="library" aria-labelledby="libraryTitle">
        <div class="section-head"><h2 id="libraryTitle" class="eyebrow"></h2><span id="inventoryCount" class="inventory-count">12 / 12</span></div>
        <div class="palette-labels" aria-hidden="true"><span id="forwardLabel"></span><span id="reverseLabel"></span></div>
        <div id="palette" class="palette"></div>
        <p id="libraryNote" class="library-note"></p>
        <div class="examples">
          <p class="eyebrow"><span data-i18n="examples.heading"></span> <svg class="dice" viewBox="0 0 20 20" aria-hidden="true"><use href="#diceIcon"/></svg></p>
          <div class="example-buttons">
            <button id="next2" type="button" class="example-button" data-i18n-aria="examples.pairLabel"><span data-i18n="examples.pair"></span><svg class="dice" viewBox="0 0 20 20" aria-hidden="true"><use href="#diceIcon"/></svg></button>
            <button id="next3" type="button" class="example-button" data-i18n-aria="examples.tripleLabel"><span data-i18n="examples.triple"></span><svg class="dice" viewBox="0 0 20 20" aria-hidden="true"><use href="#diceIcon"/></svg></button>
          </div>
          <p id="cycleNote" class="cycle-note"></p>
        </div>
      </section>

      <section id="chamber" class="chamber" data-state="empty">
        <div class="chamber-heading"><p class="eyebrow" id="fieldLabel"></p></div>
        <div id="capacity" class="capacity" role="img">
          <span class="capacity-dot" aria-hidden="true"></span>
          <span class="capacity-dot" aria-hidden="true"></span>
          <span class="capacity-dot" aria-hidden="true"></span>
        </div>
        <div class="field-wrap">
          <svg id="field" class="field" viewBox="0 0 640 600" role="img" aria-labelledby="fieldTitle fieldDescription">
            <title id="fieldTitle"></title>
            <desc id="fieldDescription"></desc>
            <defs>
              <radialGradient id="focusLight"><stop stop-color="var(--accent)" stop-opacity=".25"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></radialGradient>
              <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3"/></filter>
              <filter id="pointGlow" x="-200%" y="-200%" width="500%" height="500%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
              <pattern id="fieldGrid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#79aed0" stroke-opacity=".08" stroke-width=".7"/></pattern>
              <clipPath id="discClip"><circle cx="320" cy="294" r="245"/></clipPath>
            </defs>
            <g aria-hidden="true">
              <rect class="instrument-only" x="70" y="44" width="500" height="500" fill="url(#fieldGrid)" clip-path="url(#discClip)"/>
              <g class="engraving artifact-only"><circle cx="320" cy="294" r="251"/><circle cx="320" cy="294" r="239"/><circle cx="320" cy="294" r="190" opacity=".4"/></g>
              <g class="manuscript-ornament artifact-only">
                <circle cx="320" cy="294" r="285"/>
                <circle cx="320" cy="294" r="281" stroke-opacity=".4"/>
                <g class="celestial-track"><circle cx="320" cy="294" r="319" stroke-opacity=".4"/><circle cx="320" cy="294" r="322"/></g>
                <g id="manuscriptLegend"></g>
              </g>
              <g class="celestial-orbit artifact-only">
                <path class="star" transform="translate(320 -10)" d="M0-9 2.7-2.7 9 0 2.7 2.7 0 9-2.7 2.7-9 0-2.7-2.7Z"/>
                <g class="sun" transform="translate(624 294)"><circle r="5.5"/><circle r="1.2" fill="var(--accent)" stroke="none"/><path d="M0-8V-11M0 8V11M-8 0H-11M8 0H11M-5.7-5.7-7.8-7.8M5.7 5.7 7.8 7.8M-5.7 5.7-7.8 7.8M5.7-5.7 7.8-7.8"/></g>
                <path class="star" transform="translate(320 598)" d="M0-9 2.7-2.7 9 0 2.7 2.7 0 9-2.7 2.7-9 0-2.7-2.7Z"/>
                <g class="comet" transform="translate(320 294) rotate(270) translate(0 -304)"><circle cy="4" r="3"/><path d="M-2 1Q-5-3-6-9M0 0V-11M2 1Q5-3 6-9"/></g>
                <path data-alchemical="fire" transform="translate(320 294) rotate(45) translate(0 -304)" d="M0-8 8 7H-8Z"/>
                <path data-alchemical="air" transform="translate(320 294) rotate(135) translate(0 -304)" d="M0-8 8 7H-8ZM-6 2H6"/>
                <g data-alchemical="salt" transform="translate(320 294) rotate(225) translate(0 -304)"><circle r="7"/><path d="M-7 0H7"/></g>
                <path data-alchemical="saturn" transform="translate(320 294) rotate(315) translate(0 -304)" d="M-3-10V10M-7-6H2M-3 0C7-7 8 3 3 7Q1 10 5 10"/>
              </g>
              <g id="dialTicks" class="outer-ticks"></g>
              <g class="orbit artifact-only engraving"><circle class="orbit-detail" cx="320" cy="294" r="231"/><path d="M320 38 326 44 320 50 314 44ZM320 538 326 544 320 550 314 544ZM64 294 70 288 76 294 70 300ZM564 294 570 288 576 294 570 300"/></g>
              <circle class="engraving instrument-only" cx="320" cy="294" r="245"/>
              <path class="guide" d="M320 90V498M143.33 192 496.67 396M143.33 396 496.67 192"/>
              <path class="triangle artifact-only" d="M320 136 183.17 373 456.83 373Z"/>
              <path class="triangle triangle-inverse artifact-only" d="M320 452 183.17 215 456.83 215Z"/>
              <g class="instrument-only"><text class="instrument-label" x="77" y="565" data-i18n="field.colorSpace"></text><text class="instrument-label" x="492" y="565">Σ → 0</text></g>
              <g id="strands"></g>
              <g id="resultSeal" class="result-seal instrument-only"></g>
              <circle id="sealBackplate" class="seal-backplate artifact-only" cx="320" cy="294" r="40"/>
              <circle class="target-light" cx="320" cy="294" r="50"/>
              <circle id="centerTarget" class="center-target" cx="320" cy="294" r="24"/>
              <circle class="release-ring" cx="320" cy="294" r="100"/>
              <g id="preview" hidden><path id="previewPath" class="preview-path"/><circle id="previewDot" class="preview-dot" r="5"/><circle id="previewRing" class="preview-ring" r="19"/></g>
              <g id="focus" transform="translate(320 294)"><circle class="focus-halo" r="28"/><circle class="focus-ring" r="8"/><circle class="focus-dot" r="3.7"/><circle class="focus-seed" r="1.4"/></g>
              <g id="alchemySeal" class="alchemy-seal artifact-only" transform="translate(270 244)"></g>
            </g>
          </svg>
          <div id="slots" class="slots" role="group"></div>
        </div>
        <div class="field-status" role="status" aria-live="polite" aria-atomic="true">
          <h2 id="resultTitle" class="result-title"></h2>
          <p id="resultDetail" class="result-detail"></p>
        </div>
        <div class="assembly-controls"><span id="slotCount"></span><button id="reset" class="reset" data-i18n="reset" type="button" disabled></button></div>
        <div class="bind-space"><button id="bindSeal" class="bind-seal" type="button" hidden></button></div>
      </section>

      <aside id="readout" class="readout" data-balanced="false" data-i18n-aria="readout.label">
        <section class="instrument-only" aria-labelledby="chargeTitle">
          <h2 id="stateName" class="ability-name" hidden></h2>
          <h2 id="chargeTitle" class="eyebrow" data-i18n="charge.heading"></h2>
          <div class="charge-value"><span id="chargeValue">0</span><span class="charge-unit">e</span></div>
          <div class="charge-scale" aria-hidden="true"><div class="charge-rail"></div><div id="chargeFill" class="charge-fill"></div><div id="ticks"></div><div id="chargeMarker" class="charge-marker"></div><div id="chargePreview" class="scale-preview" hidden></div></div>
        </section>
        <section class="artifact-only" aria-labelledby="abilityHeading">
          <h2 id="abilityHeading" class="eyebrow" data-i18n="ability.heading"></h2>
          <div id="abilityPreview" class="ability-preview" aria-hidden="true"></div>
          <h3 id="abilityName" class="ability-name"></h3>
          <p id="abilityDetail" class="ability-detail"></p>
          <p class="action-direction" data-i18n="direction.inward"></p>
          <div id="actionScale" class="action-scale" data-ready="false">
            <ol id="actionSteps" class="action-steps" data-i18n-aria="action.scale"></ol>
            <div class="action-axis" aria-hidden="true"><div id="actionFill" class="action-fill" hidden></div><div id="actionMarker" class="action-marker" hidden></div><div id="actionPreview" class="scale-preview" hidden></div></div>
          </div>
          <p class="action-direction" data-i18n="direction.outward"></p>
        </section>
        <div class="readout-line instrument-only"></div>
        <section class="instrument-only" aria-labelledby="balanceTitle">
          <h2 id="balanceTitle" class="eyebrow" data-i18n="balance.heading"></h2>
          <div class="balance-value"><span class="balance-indicator" aria-hidden="true"></span><span id="balanceValue"></span></div>
          <div id="balanceTracks" class="balance-tracks" aria-hidden="true"></div>

  <script id="localization">
    'use strict';
    const supportedLanguages = ['en', 'es', 'pt', 'zh', 'ru'];
    let languageChoice = 'auto';
    let language = 'en';

    function resolveLanguage(choice) {
      if (supportedLanguages.includes(choice)) return choice;
      try {
        const primary = new Intl.Locale(navigator.language).language;
        return supportedLanguages.includes(primary) ? primary : 'en';
      } catch { return 'en'; }
    }

    function t(key, params = {}) {
      const text = translations[language]?.[key] ?? translations.en?.[key] ?? key;
      return text.replace(/\{(\w+)\}/g, (match, name) => Object.hasOwn(params, name) ? String(params[name]) : match);
    }

    function setLanguage(choice) {
      languageChoice = supportedLanguages.includes(choice) ? choice : 'auto';
      language = resolveLanguage(languageChoice);
      try { localStorage.setItem('qcd-language', languageChoice); } catch { /* File URLs may disallow storage. */ }
      renderLanguage();
    }

    try {
      const saved = localStorage.getItem('qcd-language');
      if (saved === 'auto' || supportedLanguages.includes(saved)) languageChoice = saved;
    } catch { /* The instrument also works without persistent storage. */ }
    language = resolveLanguage(languageChoice);
    document.documentElement.lang = language;
    window.addEventListener('languagechange', () => {
      if (languageChoice === 'auto') {
        language = resolveLanguage('auto');
        renderLanguage();
      }
    });
  </script>
  <script>

    const byId = Object.fromEntries(pieces.map(piece => [piece.id, piece]));
    const colors = ['red', 'green', 'blue'];
    const colorNames = Object.fromEntries(colors.map(color => [color, '']));
    colors.forEach(color => Object.defineProperty(colorNames, color, { enumerable: true, get: () => t(`color.${color}`) }));
    const families = {
      red: { label: '♂', get name() { return t('family.red'); }, path: 'M29.5 29A9 9 0 1 1 11.5 29A9 9 0 1 1 29.5 29ZM26.9 22.6 36.5 13M28.5 13H36.5V21' },
      green: { label: '♀', get name() { return t('family.green'); }, path: 'M33 20A9 9 0 1 1 15 20A9 9 0 1 1 33 20ZM24 29V40M18 35H30' },
      blue: { label: '☾', get name() { return t('family.blue'); }, path: 'M34.6 13.5A14 14 0 1 0 34.6 37.5A15 15 0 0 1 34.6 13.5Z' }
    };
    const vectors = { red: { x: 0, y: -1 }, green: { x: -Math.sqrt(3) / 2, y: .5 }, blue: { x: Math.sqrt(3) / 2, y: .5 } };

    for (let a = 0; a < pieces.length; a++) {

        if (analyzeCombination(pair).valid) recipes2.push(pair);

    }
    let slots = [null, null, null];
    const abilities = Array(6).fill(null);
    const actions = [
      { id: 'compression', path: 'M31 31 43 43M36 43H43V36M69 31 57 43M57 36V43H64M31 69 43 57M36 57H43V64M69 69 57 57M57 64V57H64' },
      { id: 'attraction', path: 'M72 50H44M52 42 44 50 52 58' },

    ];
    actions.forEach((action, index) => {
      const fields = ['name', 'genitive', 'detail'];
      if (index > 0 && index < 4) fields.push('smallDetail');
      fields.forEach(field => Object.defineProperty(action, field, { enumerable: true, get: () => t(`action.${action.id}.${field}`) }));
    });
    const kindNames = { get meson() { return t('kind.meson'); }, get baryon() { return t('kind.baryon'); }, get antibaryon() { return t('kind.antibaryon'); } };
    let soundEnabled = true;

    const messages = new Map();

    function setMessage(id, key = '', params = {}) {
      if (key) messages.set(id, { key, params });

      $(id).textContent = key ? t(key, typeof params === 'function' ? params() : params) : '';
    }

    function reservedIds() {
      return abilities.filter(Boolean).flat();
    }

    function abilityInfo(ids) {
      const small = ids.length === 2;
      const action = actions[totalThirds(ids) / 3 + 2];
      return { action, small, detail: small ? action.smallDetail : action.detail,
        label: t(`action.${action.id}.${small ? 'smallName' : 'name'}`),
        full: t(`action.${action.id}.${small ? 'smallSeal' : 'full'}`) };
    }

    function sealIcon(ids) {
      const { action, small } = abilityInfo(ids);
      const directional = action.id === 'attraction' || action.id === 'repulsion';
      const objectX = directional ? 34 : 50;
      return `<svg class="seal-icon" data-action="${action.id}" data-size="${small ? 'small' : 'large'}" width="100" height="100" viewBox="0 0 100 100" aria-hidden="true">
        <circle class="seal-rim" cx="50" cy="50" r="${small ? 32 : 40}"/>

    }

    function fractionText(n) {
      if (n === 0) return '0';
      const sign = n < 0 ? '−' : '+';
      const absolute = Math.abs(n);
      if (absolute % 3 === 0) return sign + absolute / 3;

    function colorVector(ids = slots) {

      }, { x: 0, y: 0 });
    }

    function totalThirds(ids = slots) {
      return ids.reduce((sum, id) => sum + (id ? byId[id].charge : 0), 0);
    }

    function analyzeCombination(ids = slots) {
      const chosen = ids.filter(Boolean).map(id => byId[id]);
      if (chosen.length < 2) return { valid: false, kind: '', analog: '' };
      if (chosen.length === 2) {
        const quark = chosen.find(piece => !piece.anti);
        const anti = chosen.find(piece => piece.anti);
        if (!quark || !anti || quark.color !== anti.color) return { valid: false, kind: '', analog: '' };
        const neutral = quark.flavor === anti.flavor;
        const sign = quark.flavor === 'u' ? '⁺' : '⁻';
        const examples = neutral ? [t('particle.neutralPion'), t('particle.neutralRho')] : [t('particle.pion', { sign }), t('particle.rho', { sign })];

      const up = chosen.filter(piece => piece.flavor === 'u').length;
      const examples = (chosen[0].anti
        ? [[t('particle.antiDeltaMinus')], [t('particle.antineutron'), t('particle.antiDeltaZero')], [t('particle.antiproton'), t('particle.antiDeltaPlus')], [t('particle.antiDeltaPlusPlus')]]
        : [['Δ⁻'], [t('particle.neutron'), 'Δ⁰'], [t('particle.proton'), 'Δ⁺'], ['Δ⁺⁺']])[up];

    }

      }

    }

    function runeDescription(piece) {
      if (document.documentElement.dataset.theme === 'artifact') return t(`rune.${Math.abs(piece.charge) === 2 ? 'large' : 'small'}`, { symbol: families[piece.color].label, name: pieceName(piece) });

    const inspectSelector = '.piece[data-id], .socket[data-piece], .socket-target[data-insert], [data-inspect], .ability-card[data-ability]';
