        const info = abilityInfo(ids);
        const artifact = document.documentElement.dataset.theme === 'artifact';
        text = artifact ? `${info.full}\n${info.detail}` : t('tooltip.particle', { kind: kindNames[analyzeCombination(ids).kind], charge: fractionText(totalThirds(ids)) });
        text += `\n\n${t('tooltip.composition')}\n` + ids.map(id => pieceName(byId[id])).join('\n');
        if (!artifact) {
          const result = analyzeCombination(ids);
          const formula = ids.map(id => byId[id]).sort((a, b) => Number(a.anti) - Number(b.anti) || b.flavor.localeCompare(a.flavor)).map(piece => piece.flavor + (piece.anti ? '\u0304' : '')).join('');
          text += `\n\n${t('tooltip.valence', { formula })}\n${t(result.note ? 'tooltip.componentExamples' : 'tooltip.compositionExamples')}\n`;
          text += result.examples.map(name => `• ${name}`).join('\n');
          if (result.note) text += `\n\n${result.note}`;
        }
      } else {
        const id = target.dataset.id || target.dataset.piece || target.dataset.insert || target.dataset.inspect;
        if (!byId[id]) return;
        text = runeDescription(byId[id]);
        if (reservedIds().includes(id)) text += '\n' + t('tooltip.reserved');
      }
      const tooltip = $('runeTooltip');
      tooltip.textContent = text;
      tooltip.hidden = false;
      tooltipTarget = target;
      target.setAttribute('aria-describedby', 'runeTooltip');
      const anchor = target.getBoundingClientRect();
      const box = tooltip.getBoundingClientRect();
      tooltip.style.left = `${Math.max(12, Math.min(innerWidth - box.width - 12, anchor.x + anchor.width / 2 - box.width / 2))}px`;
      const top = anchor.top - box.height - 12;
      tooltip.style.top = `${Math.max(12, Math.min(innerHeight - box.height - 12, top >= 12 ? top : anchor.bottom + 12))}px`;
    }

    function cancelPress() {
      clearTimeout(pressTimer);
      press = null;
    }

    function renderPalette() {
      $('palette').innerHTML = colors.map(color => {
        const familyPieces = ['u', 'd', 'au', 'ad'].map(prefix => byId[`${prefix}-${color[0]}`]);
        return `<div class="family ${color}"><div class="family-head" aria-hidden="true"><svg class="family-symbol artifact-only" viewBox="8 6 32 36"><path d="${families[color].path}"/></svg><span class="instrument-only">${color[0]}</span><span class="family-line"></span></div>
          <div class="family-pieces">${familyPieces.map((piece, index) => `<div class="inventory-cell" data-order="${index}"><svg class="inventory-well" viewBox="0 0 48 54" aria-hidden="true"><path d="M24 2 44 14V38L24 50 4 38V14Z" transform="translate(24 26) scale(${Math.abs(piece.charge) === 2 ? 1 : .57}) translate(-24 -26)"/></svg><button class="piece ${color}" type="button" data-id="${piece.id}" aria-label="${escapeHTML(t('piece.add', { name: pieceName(piece) }))}" aria-disabled="false">${runeHTML(piece)}<span class="piece-charge">${fractionText(piece.charge)}</span></button></div>`).join('')}</div></div>`;
      }).join('');
      $('palette').addEventListener('click', event => {
        const button = event.target.closest('[data-id]');
        if (button) addPiece(button.dataset.id);
      });
      $('palette').addEventListener('pointerover', event => {
        if (event.pointerType === 'touch') return;
        const button = event.target.closest('[data-id]');
        if (button) showPreview(button.dataset.id);
        else clearPreview();
      });
      $('palette').addEventListener('pointerleave', clearPreview);
      $('palette').addEventListener('focusin', event => {
        const button = event.target.closest('[data-id]');
        if (button) showPreview(button.dataset.id);
      });
      $('palette').addEventListener('focusout', clearPreview);
    }

    function renderSlots() {
      const artifact = document.documentElement.dataset.theme === 'artifact';
      const valid = analyzeCombination().valid;
      const count = slots.filter(Boolean).length;
      $('slots').innerHTML = colors.flatMap(color => [false, true].map(anti => {
        const sign = anti ? -1 : 1;
        const x = center.x + vectors[color].x * sign * 208;
        const y = center.y + vectors[color].y * sign * 208;
        const indices = slots.flatMap((id, index) => id && byId[id].color === color && byId[id].anti === anti ? [index] : []);
        const sockets = (indices.length ? indices : [null]).map(index => {
          const piece = index === null ? null : byId[slots[index]];
          const axisName = artifact ? t(`sign.${color}.${anti ? 'reverse' : 'forward'}`) : t(anti ? 'axis.anticolor' : 'axis.color', { color: colorNames[color] });
          const label = piece ? t('piece.remove', { name: pieceName(piece) }) : t('axis.empty', { axis: axisName });
          const content = piece ? runeHTML(piece) + '<span class="socket-remove" aria-hidden="true">×</span>'
            : `<svg class="socket-ghost" viewBox="0 0 48 54" aria-hidden="true">${runeHTML({ color, anti, charge: 2 }, true)}</svg>`;
          const targets = piece ? '' : ['u', 'd'].map(flavor => {
            const candidate = byId[`${anti ? 'a' : ''}${flavor}-${color[0]}`];
            const large = flavor === 'u';
            const addLabel = t(artifact ? (large ? 'piece.addLarge' : 'piece.addSmall') : 'piece.addComponent', { name: pieceName(candidate) });
            return `<button class="socket-target socket-target-${large ? 'large' : 'small'}" type="button" data-insert="${candidate.id}" ${count === slots.length || reservedIds().includes(candidate.id) ? 'disabled' : ''} aria-label="${escapeHTML(addLabel)}"></button>`;
          }).join('');
          const tag = piece ? 'button' : 'div';
          return `<${tag} class="socket ${piece ? 'filled' : `empty ${valid ? 'optional' : ''}`}" ${piece ? `type="button" data-slot="${index}" data-piece="${piece.id}" data-size="${Math.abs(piece.charge) === 2 ? 'large' : 'small'}"` : 'role="group"'} aria-label="${escapeHTML(label)}">
            <span class="socket-face"><svg class="socket-outlines" viewBox="0 0 76 82" aria-hidden="true"><path class="socket-outline-large" d="M38 3 71 22V60L38 79 5 60V22Z"/><path class="socket-outline-small" d="M38 3 71 22V60L38 79 5 60V22Z" transform="translate(38 41) scale(.57) translate(-38 -41)"/></svg>${content}<svg class="socket-highlight" viewBox="0 0 76 82" aria-hidden="true"><path d="M38 3 71 22V60L38 79 5 60V22Z"/></svg></span>
            ${piece ? `<span class="piece-charge">${fractionText(piece.charge)}</span>` : targets}</${tag}>`;
        }).join('');
        return `<div class="orbit-slot axis-node ${color} ${y > center.y ? 'lower-axis' : ''} ${indices.length ? 'active' : ''} ${indices.length > 1 ? 'multiple' : ''}" data-axis="${color}-${anti}" style="left:${x / 640 * 100}%;top:${y / 600 * 100}%">${sockets}</div>`;
      })).join('');
      $('slotCount').textContent = t(`slots.count.${artifact ? 'artifact' : 'instrument'}`, { count });
      const capacityLabel = t('slots.capacity', { free: slots.length - count, total: slots.length });
      $('capacity').setAttribute('aria-label', capacityLabel);
      $('capacity').title = capacityLabel;
      [...$('capacity').children].forEach((dot, index) => dot.classList.toggle('spent', index < count));
      $('reset').disabled = count === 0;
      const reserved = reservedIds();
      const free = pieces.length - count - reserved.length;
      $('inventoryCount').textContent = `${free} / ${pieces.length}`;
      $('inventoryCount').setAttribute('aria-label', t(`inventory.${artifact ? 'artifact' : 'instrument'}`, { free, total: pieces.length, reserved: reserved.length }));
      document.querySelectorAll('.piece').forEach(button => {
        const taken = slots.includes(button.dataset.id) || reserved.includes(button.dataset.id);
        const cell = button.parentElement;
        const locked = reserved.includes(button.dataset.id);
        cell.classList.toggle('reserved', locked);
        if (locked) {
          cell.dataset.inspect = button.dataset.id;
          cell.tabIndex = 0;
          cell.setAttribute('role', 'img');
          cell.setAttribute('aria-label', t('piece.reserved', { name: pieceName(byId[button.dataset.id]) }));
        } else {
          delete cell.dataset.inspect;
          cell.removeAttribute('tabindex');
          cell.removeAttribute('role');
          cell.removeAttribute('aria-label');
        }
        button.setAttribute('aria-label', t('piece.add', { name: pieceName(byId[button.dataset.id]) }));
        button.classList.toggle('in-use', taken);
        button.disabled = taken;
        button.setAttribute('aria-disabled', String(taken || count === 3));
      });
      for (const size of [2, 3]) $('next' + size).disabled = !availableRecipes(size).length;
    }

    function renderAbilities() {
      const artifact = document.documentElement.dataset.theme === 'artifact';
      $('abilitiesTitle').textContent = t(`abilities.${artifact ? 'artifact' : 'instrument'}`);
      $('releaseAll').textContent = t(`releaseAll.${artifact ? 'artifact' : 'instrument'}`);
      $('releaseAll').disabled = !abilities.some(Boolean);
      $('abilityCount').textContent = `${abilities.filter(Boolean).length} / 6`;
      $('abilityBar').innerHTML = abilities.map((ids, index) => {
        if (!ids) return `<li class="ability-slot empty" aria-label="${escapeHTML(t('ability.freeSlot', { index: index + 1 }))}"><span aria-hidden="true">${String(index + 1).padStart(2, '0')}</span></li>`;
        const info = abilityInfo(ids);
        const physical = `${kindNames[analyzeCombination(ids).kind]} · ${fractionText(totalThirds(ids))} e`;
        return `<li class="ability-slot filled"><button type="button" class="ability-card" data-ability="${index}" aria-label="${escapeHTML(t('ability.inspect', { name: artifact ? info.full : physical }))}">
          ${artifact ? sealIcon(ids) : compositionIcon(ids)}<span class="ability-label">${escapeHTML(artifact ? info.label : physical)}</span></button>
          <button class="ability-remove" type="button" data-release="${index}" aria-label="${escapeHTML(t('ability.release', { name: artifact ? info.full : physical }))}">×</button></li>`;
      }).join('');
      $('bindSeal').hidden = !analyzeCombination().valid;
      $('bindSeal').textContent = t(`bind.${artifact ? 'artifact' : 'instrument'}`);
    }

    function bindSeal() {
      const ids = slots.filter(Boolean);
      const index = abilities.indexOf(null);
      if (index < 0 || !analyzeCombination(ids).valid || ids.some(id => reservedIds().includes(id))) return;
      abilities[index] = [...ids];
      slots = [null, null, null];
      setMessage('cycleNote');
      stopVoices();
      render();
      const card = $('abilityBar').querySelector(`[data-ability="${index}"]`);
      setMessage('announcement', 'ability.saved', () => ({ name: document.documentElement.dataset.theme === 'artifact'
        ? abilityInfo(ids).label : `${kindNames[analyzeCombination(ids).kind]} · ${fractionText(totalThirds(ids))} e` }));
      card.focus({ preventScroll: pointerFocus });
    }

    function releaseAbility(index = null) {
      const ids = index === null ? reservedIds() : abilities[index];
      if (!ids?.length) return;
      if (index === null) abilities.fill(null);
      else abilities[index] = null;
      render();
      setMessage('announcement', `ability.returned.${document.documentElement.dataset.theme}`, { count: ids.length });
      document.querySelector(`.piece[data-id="${ids[0]}"]`).focus({ preventScroll: pointerFocus });
      clearPreview();
    }

    function renderDial() {
      // Center both reading directions on the same band between radii 251 and 285.
      $('manuscriptLegend').innerHTML = colors.flatMap(color => [false, true].map(anti => {
        const sign = anti ? -1 : 1;
        const angle = Math.atan2(vectors[color].y * sign, vectors[color].x * sign);
        const lower = vectors[color].y * sign > 0;
        const radius = 268;
        const halfArc = 26 * Math.PI / 180;
        const start = angle + (lower ? halfArc : -halfArc);
        const end = angle + (lower ? -halfArc : halfArc);
        const id = `inscription-${color}-${anti ? 'reverse' : 'forward'}`;
        const arc = `M${center.x + Math.cos(start) * radius} ${center.y + Math.sin(start) * radius}A${radius} ${radius} 0 0 ${lower ? 0 : 1} ${center.x + Math.cos(end) * radius} ${center.y + Math.sin(end) * radius}`;
        return `<g class="${color}"><defs><path id="${id}" d="${arc}"/></defs>
          <path transform="translate(${center.x} ${center.y}) rotate(${angle * 180 / Math.PI + 30})" d="M252 0H285"/>
          <text class="manuscript-inscription" text-anchor="middle"><textPath href="#${id}" startOffset="50%" data-i18n="sign.${color}.${anti ? 'reverse' : 'forward'}"></textPath></text></g>`;
      })).join('');
      $('dialTicks').innerHTML = Array.from({ length: 90 }, (_, i) => {
        const angle = i * Math.PI * 2 / 90;
        const major = i % 5 === 0;
        const radius = major ? 242 : 246;
        return `<line class="${major ? 'major-ticks' : ''}" x1="${center.x + Math.sin(angle) * radius}" y1="${center.y - Math.cos(angle) * radius}" x2="${center.x + Math.sin(angle) * 250}" y2="${center.y - Math.cos(angle) * 250}"/>`;
      }).join('');
      $('ticks').innerHTML = Array.from({ length: 13 }, (_, index) => {
        const n = index - 6;
        return `<span class="tick ${n % 3 === 0 ? 'major' : ''}" style="left:${index / 12 * 100}%"></span>${n % 3 === 0 ? `<span class="tick-label" style="left:${index / 12 * 100}%">${fractionText(n)}</span>` : ''}`;
      }).join('');
      $('balanceTracks').innerHTML = colors.map(color => `<div class="balance-track ${color}"><span>${color[0]}</span><div class="balance-track-rail"><span id="track-${color}" class="balance-track-fill"></span></div></div>`).join('');
    }

    function currentPosition(now) {
      const t = motionPreference.matches ? 1 : Math.min(1, Math.max(0, (now - motion.startedAt) / motion.duration));
      const eased = 1 - Math.pow(1 - t, 4);
      return { x: motion.from.x + (motion.target.x - motion.from.x) * eased, y: motion.from.y + (motion.target.y - motion.from.y) * eased,
        moving: t < 1 && Math.hypot(motion.target.x - motion.from.x, motion.target.y - motion.from.y) > .001 };
    }

    function animateField(time) {
      frame = 0;
      const point = currentPosition(time);
      const valid = $('chamber').dataset.state === 'balanced';
      const scientific = document.documentElement.dataset.theme === 'instrument';
      $('focus').setAttribute('transform', `translate(${point.x} ${point.y})`);
      strandElements.forEach(({ element, glow, anchor, index }) => {
        const dx = point.x - anchor.x;
        const dy = point.y - anchor.y;
        const length = Math.max(1, Math.hypot(dx, dy));
        let path = `M${anchor.x} ${anchor.y}`;
        if (scientific) {
          const amplitude = motionPreference.matches ? 0 : Math.min(4, 1.8 + length * .012);
          for (let step = 1; step <= 12; step++) {
            const u = step / 12;
            const wave = Math.sin(Math.PI * u) * Math.sin(time * .07 + index * 2.1)
              + Math.sin(2 * Math.PI * u) * Math.sin(time * .11 + index * 2.1) * .22;
            const offset = step === 12 ? 0 : amplitude * wave;
            path += `L${anchor.x + dx * u - dy / length * offset} ${anchor.y + dy * u + dx / length * offset}`;
          }
        } else {
          const wave = !motionPreference.matches && valid ? Math.sin(time * .003 + index * 2.1) * 4 : 0;
          const bend = wave + (index - 1) * 5;
          path += `Q${(anchor.x + point.x) / 2 - dy / length * bend} ${(anchor.y + point.y) / 2 + dx / length * bend} ${point.x} ${point.y}`;
        }
        element.setAttribute('d', path);
        glow.setAttribute('d', path);
      });
      if (!document.hidden && !motionPreference.matches && (point.moving || valid || (scientific && strandElements.length))) frame = requestAnimationFrame(animateField);
    }

    function renderField(result) {
      const chosen = slots.filter(Boolean).map(id => byId[id]);
      const vector = colorVector();
      const now = performance.now();
      motion.from = currentPosition(now);
      motion.target = { x: center.x + vector.x * vectorScale, y: center.y + vector.y * vectorScale };
      $('focus').classList.toggle('focus-appearing', !strandElements.length && chosen.length > 0 && !result.valid);
      // A new focus appears at its target; completed seals also align on their first frame.
      if (!strandElements.length || result.valid || !chosen.length) motion.from = { ...motion.target };
      motion.startedAt = now;
      $('strands').innerHTML = chosen.map(piece => `<path class="strand strand-glow ${piece.color}"/><path class="strand ${piece.color} ${piece.anti ? 'reverse' : ''}"/>`).join('');
      const screenToField = $('field').getScreenCTM().inverse();
      strandElements = chosen.map((piece, index) => {
        const sign = piece.anti ? -1 : 1;
        const socket = $('slots').querySelector(`[data-piece="${piece.id}"] .socket-face`).getBoundingClientRect();
        const { x, y } = new DOMPoint(socket.x + socket.width / 2, socket.y + socket.height / 2).matrixTransform(screenToField);
        return { glow: $('strands').children[index * 2], element: $('strands').children[index * 2 + 1], index,
          anchor: { x: x - vectors[piece.color].x * sign * 30, y: y - vectors[piece.color].y * sign * 30 } };
      });
      const charge = totalThirds();
      const radius = 35 + Math.abs(charge) * 2;
      const reverse = result.kind === 'antibaryon' ? -1 : 1;
      if (result.valid) {
        $('sealBackplate').setAttribute('r', chosen.length === 2 ? 32 : 40);
        const shape = result.kind === 'meson'
          ? `<ellipse cx="320" cy="294" rx="${radius}" ry="${radius * .56}" transform="rotate(-35 320 294)"/><ellipse cx="320" cy="294" rx="${radius}" ry="${radius * .56}" transform="rotate(35 320 294)"/>`
          : `<path d="M320 ${294 - radius * reverse} ${320 - radius * .866} ${294 + radius * .5 * reverse} ${320 + radius * .866} ${294 + radius * .5 * reverse}Z"/><circle cx="320" cy="294" r="${radius * .53}"/>`;
        $('resultSeal').innerHTML = `<circle cx="320" cy="294" r="${radius + 12}" stroke-dasharray="1 8"/>${shape}`;
      } else $('resultSeal').innerHTML = '';
      $('alchemySeal').innerHTML = result.valid ? sealIcon(slots.filter(Boolean))
        : '<svg class="seal-icon" width="100" height="100" viewBox="0 0 100 100" aria-hidden="true"><path class="seal-rim" d="M18 50A32 32 0 0 1 50 18M82 50A32 32 0 0 1 50 82" stroke-dasharray="2 5"/></svg>';
      if (frame) cancelAnimationFrame(frame);
      animateField(now);
    }

    function renderReadout(result) {
      const n = totalThirds();
      const pct = (n + 6) / 12 * 100;
      $('chargeValue').textContent = fractionText(n);
      $('chargeMarker').style.left = `${pct}%`;
      $('chargeFill').style.left = `${Math.min(50, pct)}%`;
      $('chargeFill').style.width = `${Math.abs(pct - 50)}%`;
      $('readout').dataset.balanced = String(result.valid);
      $('stateName').textContent = result.valid ? kindNames[result.kind] : '';
      $('stateName').hidden = !result.valid;
      const info = result.valid ? abilityInfo(slots.filter(Boolean)) : null;
      $('abilityPreview').innerHTML = info ? sealIcon(slots.filter(Boolean)) : '';
      $('abilityName').textContent = info ? t(`action.${info.action.id}.${info.small ? 'smallSeal' : 'seal'}`) : t('ability.empty');
      $('abilityDetail').textContent = info ? info.detail : t('ability.hint');
      const count = slots.filter(Boolean).length;
      $('actionScale').dataset.ready = String(result.valid);
      $('actionSteps').innerHTML = actions.map((action, index) => `<li class="action-step"${info?.action.id === action.id ? ' aria-current="true"' : ''}><span class="action-value">${fractionText((index - 2) * 3)}</span> <span class="action-name">${escapeHTML(action.name)}</span></li>`).join('');
      $('actionMarker').hidden = $('actionFill').hidden = count === 0;
      $('actionMarker').style.top = `${pct}%`;
      $('actionFill').style.top = `${Math.min(50, pct)}%`;
      $('actionFill').style.height = `${Math.abs(pct - 50)}%`;
      $('balanceValue').textContent = t(!count ? 'balance.empty' : result.valid ? 'balance.ready' : 'balance.seeking');
      const raw = colors.map(color => slots.filter(Boolean).reduce((sum, id) => sum + (byId[id].color === color ? (byId[id].anti ? -1 : 1) : 0), 0));
      // Remove the shared component: three equal colour counts also cancel.
      const mean = raw.reduce((sum, value) => sum + value, 0) / 3;
      colors.forEach((color, index) => {
        const residual = (raw[index] - mean) / 2 * 50;
        $(`track-${color}`).style.left = `${Math.min(50, 50 + residual)}%`;
        $(`track-${color}`).style.width = `${Math.abs(residual)}%`;
      });
    }

    function showPreview(id) {
      if (!slots.includes(null) || slots.includes(id) || reservedIds().includes(id)) return clearPreview();
      const future = [...slots];
      future[future.indexOf(null)] = id;
      const vector = colorVector(future);
      const x = center.x + vector.x * vectorScale;
      const y = center.y + vector.y * vectorScale;
      const piece = byId[id];
      $('preview').setAttribute('class', piece.color);
      $('preview').removeAttribute('hidden');
      $('previewPath').setAttribute('d', slots.some(Boolean) ? `M${motion.target.x} ${motion.target.y}L${x} ${y}` : '');
      for (const name of ['previewDot', 'previewRing']) {
        $(name).setAttribute('cx', x);
        $(name).setAttribute('cy', y);
      }
      $('previewRing').style.display = analyzeCombination(future).valid ? '' : 'none';
      const pct = (totalThirds(future) + 6) / 12 * 100;
      $('actionPreview').style.top = `${pct}%`;
      $('actionPreview').dataset.ready = String(analyzeCombination(future).valid);
      $('chargePreview').style.left = `${pct}%`;
      $('actionPreview').hidden = $('chargePreview').hidden = false;
      document.querySelectorAll('[data-axis]').forEach(node => {
        if (node.dataset.axis === `${piece.color}-${piece.anti}`) node.dataset.previewSize = Math.abs(piece.charge) === 2 ? 'large' : 'small';
        else delete node.dataset.previewSize;
      });
    }

    function clearPreview() {
      $('preview').setAttribute('hidden', '');
      $('actionPreview').hidden = $('chargePreview').hidden = true;
      document.querySelectorAll('[data-preview-size]').forEach(node => delete node.dataset.previewSize);
    }

    function render({ audible = false, added = null, localeOnly = false } = {}) {
      hideTooltip();
      clearPreview();
      if (audible) stopVoices();
      const result = analyzeCombination();
      const count = slots.filter(Boolean).length;
      const n = totalThirds();
      const state = !count ? 'empty' : result.valid ? 'balanced' : 'seeking';
      $('chamber').dataset.state = state;
      const artifact = document.documentElement.dataset.theme === 'artifact';
      $('resultTitle').textContent = !count ? t('result.empty.artifact') : result.valid ? abilityInfo(slots.filter(Boolean)).label : t('ability.empty');
      $('resultDetail').textContent = t(!count ? 'result.hint.artifact' : result.valid ? (count === 2 ? 'result.smallComplete' : 'result.largeComplete') : count === 1 ? 'result.one' : count === 2 ? 'result.two' : 'result.three');
      if (!artifact) {
        $('resultTitle').textContent = !count ? t('result.empty.instrument') : result.valid ? kindNames[result.kind] : t('result.seeking.instrument');
        $('resultDetail').textContent = !count ? t('result.hint.instrument') : t('result.components', { count, charge: fractionText(n) });
      }
      $('physicalResult').textContent = result.valid ? t('science.result', { kind: kindNames[result.kind], analog: result.analog, charge: fractionText(n) }) : t(!count ? 'science.intro' : 'science.seeking');
      $('fieldDescription').textContent = [t(`field.count.${artifact ? 'artifact' : 'instrument'}`, { count }),
        t(!count ? 'field.empty' : result.valid ? 'field.centered' : 'field.offset'),
        artifact ? (result.valid ? abilityInfo(slots.filter(Boolean)).full : t('field.unfinished')) : t('field.charge', { charge: fractionText(n) })].join(' ');
      renderSlots();
      renderReadout(result);
      if (!localeOnly) renderField(result);
      renderAbilities();
      // Text refreshes must not touch live oscillators, focus motion, or arrival effects.
      if (localeOnly) return;
      const key = slots.filter(Boolean).slice().sort().join('|');
      clearTimeout(arrivalTimer);
      $('chamber').classList.remove('arrived');
      if (result.valid && key !== previousKey) {
        void $('chamber').offsetWidth;
        $('chamber').classList.add('arrived');
        arrivalTimer = setTimeout(() => $('chamber').classList.remove('arrived'), 1000);
        if (audible && artifact) playSound(result);
      } else if (audible && added && artifact) playSound(null, added);
      syncStringSound();
      previousKey = key;
    }

    function addPiece(id) {
      if (!byId[id] || slots.includes(id) || reservedIds().includes(id)) return;
      const index = slots.indexOf(null);
      if (index < 0) {
        setMessage('announcement', `slots.full.${document.documentElement.dataset.theme}`);
        return;
      }
      const source = document.querySelector(`.piece[data-id="${id}"]`);
      const from = source.querySelector('.rune').getBoundingClientRect();
      const moveFocus = document.activeElement === source || document.activeElement?.getAttribute('data-insert') === id;
      slots[index] = id;
      setMessage('cycleNote');
      setMessage('announcement');
      render({ audible: true, added: byId[id] });
      const socket = $('slots').querySelector(`[data-slot="${index}"]`);
      animateTransfer(byId[id], from, socket.querySelector('.rune').getBoundingClientRect());
      if (moveFocus) socket.focus({ preventScroll: true });
    }

    function removePiece(index) {
      const removed = slots[index];
      const from = $('slots').querySelector(`[data-slot="${index}"] .rune`).getBoundingClientRect();
      slots[index] = null;
      setMessage('cycleNote');
      render({ audible: true });
      const returned = document.querySelector(`.piece[data-id="${removed}"]`);
      returned.focus({ preventScroll: true });
      animateTransfer(byId[removed], from, returned.querySelector('.rune').getBoundingClientRect());
      clearPreview();
    }

    function animateTransfer(piece, from, to) {
      if (motionPreference.matches) return;
      const flight = document.createElement('span');
      flight.className = `stone-flight ${piece.color}`;
      flight.setAttribute('aria-hidden', 'true');
      flight.innerHTML = runeHTML(piece);
      Object.assign(flight.style, { left: `${from.x}px`, top: `${from.y}px`, width: `${from.width}px`, height: `${from.height}px` });
      document.body.append(flight);
      const animation = flight.animate([
        { transform: 'translate(0, 0) scale(1)', opacity: 1 },
        { transform: `translate(${to.x - from.x}px, ${to.y - from.y}px) scale(${to.width / from.width}, ${to.height / from.height})`, opacity: 0 }
      ], { duration: 420, easing: 'cubic-bezier(.2,.75,.2,1)' });
      animation.finished.then(() => flight.remove(), () => flight.remove());
    }

    function availableRecipes(count) {
      const reserved = reservedIds();
      return (count === 2 ? recipes2 : recipes3).filter(ids => ids.every(id => !reserved.includes(id)));
    }

    function randomRecipe(count) {
      const current = slots.filter(Boolean).slice().sort().join('|');
      const available = availableRecipes(count);
      const groups = actions.map((_, index) => available.filter(ids => totalThirds(ids) === (index - 2) * 3)).filter(group => group.length);
      if (!groups.length) return;
      const group = groups[Math.floor(Math.random() * groups.length)];
      const alternatives = group.filter(ids => ids.slice().sort().join('|') !== current);
      const candidates = alternatives.length ? alternatives : group;
      setRecipe(candidates[Math.floor(Math.random() * candidates.length)]);
    }

    function setRecipe(ids) {
      if (!Array.isArray(ids) || ids.length < 2 || ids.length > 3 || new Set(ids).size !== ids.length || ids.some(id => !byId[id] || reservedIds().includes(id))) return;
      slots = [...ids];
      while (slots.length < 3) slots.push(null);
      setMessage('cycleNote', document.documentElement.dataset.theme === 'artifact' ? (ids.length === 2 ? 'examples.randomPair' : 'examples.randomTriple') : 'examples.randomComposition', { count: ids.length });
      setMessage('announcement');
      render({ audible: true });
    }

    function ensureAudio() {
      if (!soundEnabled) return null;
      if (!audio) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        try {
          const context = new AudioContextClass();
          const master = context.createGain();
          master.gain.value = .23;
          master.connect(context.destination);
          audio = { context, master, voices: new Set(), strings: new Set(), stringKey: '' };
        } catch { return null; }
      }
      if (audio.context.state === 'suspended') audio.context.resume().catch(() => {});
      return audio;
    }

    function stopVoices(voices = audio?.voices) {
      if (!audio) return;
      const now = audio.context.currentTime;
      voices.forEach(({ oscillator, gain, vibrato }) => {
        gain.gain.cancelScheduledValues(now);
        gain.gain.setTargetAtTime(0, now, .008);
        oscillator.stop(now + .035);
        vibrato?.stop(now + .035);
      });
      voices.clear();
    }

    function syncStringSound() {
      const count = slots.filter(Boolean).length;
      const active = soundEnabled && !document.hidden && count && document.documentElement.dataset.theme === 'instrument';
      if (!active) {
        if (audio) { stopVoices(audio.strings); audio.stringKey = ''; }
        return;
      }
      const engine = ensureAudio();
      if (!engine) return;
      const { valid, kind } = analyzeCombination();
      const charge = totalThirds() / 3;
      const key = valid ? `${kind}:${charge}` : `seeking-${count}`;
      if (engine.stringKey === key) return;
      stopVoices(engine.strings);
      engine.stringKey = key;
      const { context, master } = engine;
      const now = context.currentTime;
      // Particle type sets the intervals; each charge unit shifts the chord by two semitones.
      const intervals = { meson: [0, 7, 12], baryon: [0, 4, 7], antibaryon: [0, 3, 7] };
      const notes = valid
        ? intervals[kind].map(semitones => 146.83 * Math.pow(2, (charge * 2 + semitones) / 12))
        : [146.83, 155.56, 207.65].slice(0, Math.max(2, count));
      notes.forEach((frequency, index) => {
        const oscillator = context.createOscillator();
        const filter = context.createBiquadFilter();
        const gain = context.createGain();
        const vibrato = context.createOscillator();
        const depth = context.createGain();
        oscillator.type = 'triangle';
        oscillator.frequency.value = frequency;
        filter.type = 'lowpass';
        filter.frequency.value = 1000;
        filter.Q.value = .7;
        vibrato.frequency.value = 1.27 + index * .1;
        depth.gain.value = valid ? .6 : 1.8;
        vibrato.connect(depth);
        depth.connect(oscillator.frequency);
        gain.gain.setValueAtTime(0, now);
        gain.gain.setTargetAtTime(valid ? .034 : .022, now, .08);
        oscillator.connect(filter);
        filter.connect(gain);
        gain.connect(master);
        const voice = { oscillator, gain, vibrato };
        engine.strings.add(voice);
        oscillator.onended = () => {
          oscillator.disconnect(); filter.disconnect(); gain.disconnect(); vibrato.disconnect(); depth.disconnect();
          engine.strings.delete(voice);
        };
        oscillator.start(now);
        vibrato.start(now);
      });
    }

    function playSound(result, piece) {
      const engine = ensureAudio();
      if (!engine) return;
      const { context, master } = engine;
      const artifact = document.documentElement.dataset.theme === 'artifact';
      const base = result ? 174.61 * Math.pow(2, totalThirds() / 18) * (result.kind === 'antibaryon' ? .75 : 1) : [220, 261.63, 329.63][colors.indexOf(piece.color)] * (piece.anti ? .75 : 1);
      const notes = result ? (result.kind === 'meson' ? [1, 1.5, 2] : [1, 1.2, 1.5, 2]) : [1];
      notes.forEach((ratio, index) => {
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        const start = context.currentTime + .01 + index * (artifact ? .055 : .035);
        const duration = result ? (artifact ? 1.6 : .9) : .35;
        oscillator.type = artifact && index === 0 ? 'triangle' : 'sine';
        oscillator.frequency.setValueAtTime(base * ratio, start);
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(result ? .12 : .09, start + .025);
        gain.gain.exponentialRampToValueAtTime(.0001, start + duration);
        oscillator.connect(gain);
        gain.connect(master);
        const voice = { oscillator, gain };
        audio.voices.add(voice);
        oscillator.start(start);
        oscillator.stop(start + duration + .05);
        oscillator.onended = () => { oscillator.disconnect(); gain.disconnect(); audio.voices.delete(voice); };
      });
    }

    function renderLabels() {
      const theme = document.documentElement.dataset.theme;
      document.querySelectorAll('[data-i18n]').forEach(node => { node.textContent = t(node.dataset.i18n); });
      document.querySelectorAll('[data-i18n-aria]').forEach(node => { node.setAttribute('aria-label', t(node.dataset.i18nAria)); });
      const title = t(`app.${theme}`);
      document.querySelector('h1').textContent = title;
      document.title = `${title} · QCD`;
      document.querySelectorAll('[data-theme-choice]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.themeChoice === theme)));
      for (const [id, key] of Object.entries({ fieldLabel: 'field', fieldTitle: 'fieldTitle', libraryTitle: 'library', forwardLabel: 'forward', reverseLabel: 'reverse', libraryNote: 'libraryNote', scienceSummary: 'scienceSummary', editionLabel: 'edition' })) {
        $(id).textContent = t(`${key}.${theme}`);
      }
      $('chamber').setAttribute('aria-label', $('fieldLabel').textContent);
      $('slots').setAttribute('aria-label', t(`slots.${theme}`));
      $('toggleSound').setAttribute('aria-label', t(soundEnabled ? 'sound.onLabel' : 'sound.offLabel'));
      $('soundLabel').textContent = t(soundEnabled ? 'sound.on' : 'sound.off');
    }

    function renderLanguage() {
      const selectorFor = node => {
        if (!node) return null;
        if (node.id) return `#${CSS.escape(node.id)}`;
        const attribute = ['data-id', 'data-piece', 'data-insert', 'data-inspect', 'data-ability', 'data-release'].find(name => node.hasAttribute(name));
        return attribute ? `[${attribute}="${CSS.escape(node.getAttribute(attribute))}"]` : null;
      };
      const focused = selectorFor(document.activeElement);
      const inspected = selectorFor(tooltipTarget);
      cancelPress();
      document.documentElement.lang = language;
      $('languageSelect').value = languageChoice;
      renderLabels();
      render({ localeOnly: true });
      messages.forEach(({ key, params }, id) => setMessage(id, key, params));
      if (focused) document.querySelector(focused)?.focus({ preventScroll: true });
      if (inspected) showTooltip(document.querySelector(inspected));
    }

    function setTheme(theme) {
      stopVoices();
      document.documentElement.dataset.theme = theme;
      renderLabels();
      setMessage('cycleNote');
      render();
      try { localStorage.setItem('qcd-theme', theme); } catch { /* File URLs may disallow storage. */ }
    }

    function fitWorkspace() {
      // Enlarge the whole instrument together, bounded by both viewport dimensions.
      const scale = Math.max(1, Math.min(innerWidth / 1440, innerHeight / 1024, 2.4));
      document.documentElement.style.setProperty('--workspace-scale', String(scale));
      if (strandElements.length) renderField(analyzeCombination());
    }

    document.querySelectorAll('[data-theme-choice]').forEach(button => button.addEventListener('click', () => setTheme(button.dataset.themeChoice)));
    $('languageSelect').addEventListener('change', event => setLanguage(event.target.value));
    document.addEventListener('pointerover', event => {
      if (event.pointerType !== 'mouse') return;
      if ($('runeTooltip').contains(event.target)) { clearTimeout(tooltipHideTimer); return; }
      const target = event.target.closest(inspectSelector);
      if (target) clearTimeout(tooltipHideTimer);
      if (target && target !== tooltipTarget) showTooltip(target);
    });
    document.addEventListener('pointerout', event => {
      if (event.pointerType === 'mouse' && tooltipTarget && !tooltipTarget.contains(event.relatedTarget) && !$('runeTooltip').contains(event.relatedTarget)) {
        clearTimeout(tooltipHideTimer);
        tooltipHideTimer = setTimeout(hideTooltip, 250);
      }
    });
    document.addEventListener('focusin', event => {
      const target = event.target.closest(inspectSelector);
      if (target && !pointerFocus) showTooltip(target);
    });
    document.addEventListener('focusout', hideTooltip);
    document.addEventListener('pointerdown', event => {
      pointerFocus = true;
      suppressedTarget = null;
      cancelPress();
      if ($('runeTooltip').contains(event.target)) return;
      hideTooltip();
      const target = event.target.closest(inspectSelector);
      if (!target || event.pointerType === 'mouse' || !event.isPrimary) return;
      press = { target, x: event.clientX, y: event.clientY, pointerId: event.pointerId };
      pressTimer = setTimeout(() => {
        if (!press || !press.target.isConnected) return;
        suppressedTarget = press.target;
        clearPreview();
        showTooltip(press.target);
      }, 500);
    }, true);
    document.addEventListener('pointermove', event => {
      if (press && event.pointerId === press.pointerId && Math.hypot(event.clientX - press.x, event.clientY - press.y) > 10) {
        cancelPress();
        hideTooltip();
      }
    });
    document.addEventListener('pointerup', cancelPress);
    document.addEventListener('pointercancel', () => { cancelPress(); hideTooltip(); });
    // Suppress the synthetic click following a touch inspection, not the next gesture.
    document.addEventListener('click', event => {
      if (suppressedTarget?.contains(event.target)) {
        event.preventDefault();
        event.stopImmediatePropagation();
        suppressedTarget = null;
      }
    }, true);
    document.addEventListener('contextmenu', event => {
      if (event.target.closest(inspectSelector)) event.preventDefault();
    });
    window.addEventListener('scroll', event => {
      if (event.target === $('runeTooltip')) return;
      cancelPress();
      // Scrolling a focused card into view must not dismiss its freshly opened composition.
      if (tooltipTarget?.matches('.ability-card') && document.activeElement === tooltipTarget) showTooltip(tooltipTarget);
      else hideTooltip();
    }, true);
    window.addEventListener('resize', hideTooltip);
    window.addEventListener('blur', () => { cancelPress(); hideTooltip(); });
    $('slots').addEventListener('click', event => {
      const insert = event.target.closest('[data-insert]');
      if (insert) {
        if (!insert.disabled) addPiece(insert.dataset.insert);
        return;
      }
      const button = event.target.closest('[data-slot]');
      if (button && slots[Number(button.dataset.slot)]) removePiece(Number(button.dataset.slot));
    });
    $('slots').addEventListener('pointerover', event => {
      if (event.pointerType === 'touch') return;
      const button = event.target.closest('[data-insert]');
      if (button && !button.disabled) showPreview(button.dataset.insert);
      else clearPreview();
    });
    $('slots').addEventListener('pointerleave', clearPreview);
    $('slots').addEventListener('focusin', event => {
      const button = event.target.closest('[data-insert]');
      if (button && !button.disabled) showPreview(button.dataset.insert);
      else clearPreview();
    });
    $('slots').addEventListener('focusout', clearPreview);
    $('next2').addEventListener('click', () => randomRecipe(2));
    $('next3').addEventListener('click', () => randomRecipe(3));
    $('bindSeal').addEventListener('click', bindSeal);
    $('releaseAll').addEventListener('click', () => releaseAbility());
    $('abilityBar').addEventListener('click', event => {
      const button = event.target.closest('[data-release]');
      if (button) releaseAbility(Number(button.dataset.release));
      else {
        const card = event.target.closest('[data-ability]');
        if (card) showTooltip(card);
      }
    });
    $('reset').addEventListener('click', () => {
      slots = [null, null, null];
      document.querySelectorAll('.stone-flight').forEach(node => node.remove());
      setMessage('cycleNote');
      setMessage('announcement');
      stopVoices();
      render();
    });
    $('toggleSound').addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      $('toggleSound').setAttribute('aria-pressed', String(soundEnabled));
      $('toggleSound').setAttribute('aria-label', t(soundEnabled ? 'sound.onLabel' : 'sound.offLabel'));
      $('soundLabel').textContent = t(soundEnabled ? 'sound.on' : 'sound.off');
      if (audio) {
        const now = audio.context.currentTime;
        audio.master.gain.cancelScheduledValues(now);
        audio.master.gain.setTargetAtTime(soundEnabled ? .23 : 0, now, .015);
      }
      syncStringSound();
    });
    document.addEventListener('keydown', event => {
      pointerFocus = false;
      if (event.key === 'Escape') { cancelPress(); hideTooltip(); clearPreview(); }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        if (frame) cancelAnimationFrame(frame);
        frame = 0;
        stopVoices();
        syncStringSound();
        if (audio) audio.context.suspend().catch(() => {});
      } else {
        syncStringSound();
        if (!frame) animateField(performance.now());
      }
    });
    motionPreference.addEventListener('change', () => {
      if (frame) cancelAnimationFrame(frame);
      animateField(performance.now());
    });

    window.addEventListener('resize', fitWorkspace);
    fitWorkspace();
    renderPalette();
    renderDial();
    renderLabels();
    $('languageSelect').value = languageChoice;
    render();
    try {
      const saved = localStorage.getItem('qcd-theme');
      if (saved === 'artifact' || saved === 'instrument') setTheme(saved);
    } catch { /* The instrument also works without persistent storage. */ }
  </script>
</body>
</html>
